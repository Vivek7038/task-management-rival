# lint-and-build uses real Neon secrets from GitHub repository secrets.
# e2e-tests uses a local Postgres service container with dummy JWT/Blob tokens.

name: CI

on:
  push:
    branches: [main, master]
    paths: ['task-management-assignment/**']
  pull_request:
    branches: [main, master]
    paths: ['task-management-assignment/**']

defaults:
  run:
    working-directory: task-management-assignment

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task-management-assignment/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  e2e-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskuser
          POSTGRES_PASSWORD: taskpass
          POSTGRES_DB: taskmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskuser -d taskmanager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: task-management-assignment/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://taskuser:taskpass@localhost:5432/taskmanager
          DIRECT_URL: postgresql://taskuser:taskpass@localhost:5432/taskmanager

      - name: Seed database
        run: npx prisma db seed
        env:
          DATABASE_URL: postgresql://taskuser:taskpass@localhost:5432/taskmanager
          DIRECT_URL: postgresql://taskuser:taskpass@localhost:5432/taskmanager

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://taskuser:taskpass@localhost:5432/taskmanager
          DIRECT_URL: postgresql://taskuser:taskpass@localhost:5432/taskmanager
          JWT_SECRET: ci-dummy-jwt-secret
          BLOB_READ_WRITE_TOKEN: ''
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Run E2E tests
        run: npm test
        env:
          DATABASE_URL: postgresql://taskuser:taskpass@localhost:5432/taskmanager
          DIRECT_URL: postgresql://taskuser:taskpass@localhost:5432/taskmanager
          JWT_SECRET: ci-dummy-jwt-secret
          BLOB_READ_WRITE_TOKEN: ''
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: task-management-assignment/playwright-report/
          retention-days: 7
